<div [class.theme-light]="!isDarkTheme()">
  <app-site-header
    [variant]="isHeaderHiddenOnDesktop() ? 'light' : (isDarkTheme() ? 'dark' : 'light')"
    [showCreateButton]="showHeaderCreateButton()"
    [hideOnDesktop]="isHeaderHiddenOnDesktop()"
  ></app-site-header>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
