<header class="site-header">
  <a class="site-header__brand" routerLink="/">
    <img
      class="site-header__logo"
      [src]="
        variant() === 'light'
          ? 'images/desktop/poll-app-logo-dark.svg'
          : 'images/desktop/poll-app-logo.svg'
      "
      alt="Poll App Logo"
    />
  </a>

  @if (showCreateButton()) {
    <a class="site-header__create-button" routerLink="/surveys/new">
      Create survey
      <img class="site-header__create-button-icon" src="images/desktop/icon-plus-circle.svg" alt="" />
    </a>
  }
</header>
