<article
  class="survey-card"
  [class.survey-card--highlight]="variant() === 'highlight'"
>
  <a class="survey-card__link" [routerLink]="['/surveys', survey().id]">
    <p class="survey-card__category">{{ survey().category }}</p>
    <h3 class="survey-card__title">{{ survey().title }}</h3>
    <span class="survey-card__deadline">{{ deadlineLabel() }}</span>
  </a>
</article>
